<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="100%" role="img" aria-label="AegisOps Incident Resolution and Safety Guardrails Animation">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <style>
      .h { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #F8FAFC; }
      .p { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; fill: #94A3B8; font-size: 12px; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; font-size: 11px; }
      @keyframes flow {
        to { stroke-dashoffset: -32; }
      }
      .wire { stroke-dasharray: 6 6; animation: flow 1.6s linear infinite; }
    </style>
  </defs>

  <rect width="1200" height="410" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5" />

  <text x="32" y="40" class="h" font-size="18">How AegisOps Decides What to Fix Automatically vs. When to Ask a Human</text>
  <text x="32" y="61" class="p">Every alert passes through deterministic privacy, dependency, and safety policy gates — the AI proposes, but server-enforced policy decides.</text>

  <!-- Track wires -->
  <!-- Main trunk -->
  <path d="M 225 180 H 270 M 460 180 H 505 M 695 180 H 740" fill="none" stroke="#38BDF8" stroke-width="2.2" class="wire" />
  <!-- Branch Low Risk -->
  <path d="M 740 155 C 775 155, 775 110, 815 110" fill="none" stroke="#10B981" stroke-width="2.2" class="wire" />
  <!-- Branch High Risk -->
  <path d="M 740 195 H 815" fill="none" stroke="#F59E0B" stroke-width="2.2" class="wire" />
  <!-- Branch Refuse -->
  <path d="M 740 235 C 775 235, 775 305, 815 305" fill="none" stroke="#EF4444" stroke-width="2.2" class="wire" />
  <!-- Merge to Outcome -->
  <path d="M 995 110 C 1025 110, 1025 148, 1045 148" fill="none" stroke="#10B981" stroke-width="2" />
  <path d="M 995 195 C 1025 195, 1025 168, 1045 168" fill="none" stroke="#F59E0B" stroke-width="2" />

  <!-- Moving packet along trunk -> low risk -> resolved -->
  <circle r="4.5" fill="#10B981">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M 45 180 H 740 C 775 180, 775 110, 815 110 H 995 C 1025 110, 1025 155, 1055 155" />
  </circle>
  <!-- Moving packet along trunk -> human gate -->
  <circle r="4" fill="#F59E0B">
    <animateMotion dur="4.4s" begin="1.1s" repeatCount="indefinite" path="M 45 180 H 815 H 995" />
  </circle>
  <!-- Moving packet along trunk -> safe refusal -->
  <circle r="4" fill="#EF4444">
    <animateMotion dur="4.0s" begin="2.2s" repeatCount="indefinite" path="M 45 180 H 740 C 775 180, 775 305, 815 305 H 995" />
  </circle>

  <!-- Stage 1 -->
  <g transform="translate(32, 115)">
    <rect width="193" height="130" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.3" />
    <text x="16" y="28" class="tag" fill="#38BDF8">STEP 1 • EDGE GUARD</text>
    <text x="16" y="54" class="h" font-size="14">Alert + Scrubbing</text>
    <text x="16" y="76" class="p">HMAC signature verified.</text>
    <text x="16" y="94" class="p">SSRF blocks private targets.</text>
    <text x="16" y="112" class="p">Regex + AST scrub redacts PII.</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(270, 115)">
    <rect width="190" height="130" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.3" />
    <text x="16" y="28" class="tag" fill="#22D3EE">STEP 2 • TOPOLOGY</text>
    <text x="16" y="54" class="h" font-size="14">Blast Radius Map</text>
    <text x="16" y="76" class="p">Finds impacted downstream</text>
    <text x="16" y="94" class="p">services via Postgres CTE</text>
    <text x="16" y="112" class="p">and derives P1-P4 priority.</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(505, 115)">
    <rect width="190" height="130" rx="12" fill="#0F172A" stroke="#818CF8" stroke-width="1.3" />
    <text x="16" y="28" class="tag" fill="#A5B4FC">STEP 3 • LOCAL AI</text>
    <text x="16" y="54" class="h" font-size="14">Grounded Diagnosis</text>
    <text x="16" y="76" class="p">Hybrid pgvector + FTS search</text>
    <text x="16" y="94" class="p">over 18 SRE runbooks.</text>
    <text x="16" y="112" class="p">Ollama outputs strict JSON.</text>
  </g>

  <!-- Policy Gate Vertical Hub -->
  <g transform="translate(715, 130)">
    <rect width="52" height="128" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="1.2" />
    <text x="26" y="64" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 26 64)" class="tag" fill="#E2E8F0">POLICY</text>
  </g>

  <!-- Outcome 1: Low Risk -->
  <g transform="translate(815, 78)">
    <rect width="180" height="66" rx="10" fill="#064E3B" fill-opacity="0.4" stroke="#10B981" stroke-width="1.4" />
    <text x="14" y="25" class="tag" fill="#6EE7B7">LOW RISK • AUTO-FIX</text>
    <text x="14" y="45" class="p" fill="#D1FAE5">Restart or bounded scale-out</text>
  </g>

  <!-- Outcome 2: High Risk -->
  <g transform="translate(815, 162)">
    <rect width="180" height="72" rx="10" fill="#78350F" fill-opacity="0.4" stroke="#F59E0B" stroke-width="1.4" />
    <text x="14" y="25" class="tag" fill="#FDE68A">HIGH RISK • MFA GATE</text>
    <text x="14" y="44" class="p" fill="#FEF3C7">Waits for SRE Approver +</text>
    <text x="14" y="59" class="p" fill="#FEF3C7">6-digit TOTP verification</text>
  </g>

  <!-- Outcome 3: Refuse & Escalate -->
  <g transform="translate(815, 256)">
    <rect width="180" height="88" rx="10" fill="#7F1D1D" fill-opacity="0.38" stroke="#EF4444" stroke-width="1.4" />
    <text x="14" y="25" class="tag" fill="#FCA5A5">FORBIDDEN • SAFE REFUSAL</text>
    <text x="14" y="45" class="p" fill="#FEE2E2">Stateful DB failover or low-</text>
    <text x="14" y="61" class="p" fill="#FEE2E2">confidence LLM guesses</text>
    <text x="14" y="77" class="p" fill="#FEE2E2">escalate immediately (0 harm).</text>
  </g>

  <!-- Final Watchdog Outcome -->
  <g transform="translate(1045, 96)">
    <rect width="130" height="126" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.6" />
    <circle cx="110" cy="22" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="28" class="tag" fill="#6EE7B7">VERIFIED</text>
    <text x="14" y="52" class="h" font-size="14">60s Proof</text>
    <text x="14" y="73" class="p">Unbroken Pod,</text>
    <text x="14" y="89" class="p">HTTP &amp; metric</text>
    <text x="14" y="105" class="p">checks + PDF.</text>
  </g>

  <!-- Bottom note -->
  <rect x="32" y="356" width="1143" height="36" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
  <text x="50" y="378" class="p" fill="#CBD5E1">
    <tspan font-weight="700" fill="#38BDF8">Visitor Mode Ready:</tspan> Non-technical reviewers can replay captured live outages step-by-step, test PII redaction live, and download executive PDF postmortems safely without touching the cluster.
  </text>
</svg>
