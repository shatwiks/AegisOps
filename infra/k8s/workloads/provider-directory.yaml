apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-directory
  namespace: aegisops-healthcare
  labels:
    app: provider-directory
    aegisops.io/managed: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provider-directory
  template:
    metadata:
      labels:
        app: provider-directory
    spec:
      containers:
        - name: provider-directory
          image: aegisops/provider-directory:v1.0.0-good
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: DEMO_REDIS_URL
              value: redis://redis-session-cache:6379/0
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://host.docker.internal:55318
            - name: DEMO_INTERNAL_FAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aegisops-demo-fault-secret
                  key: token
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: provider-directory
  namespace: aegisops-healthcare
spec:
  type: NodePort
  selector:
    app: provider-directory
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30083
