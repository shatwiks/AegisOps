<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" role="img" aria-label="AegisOps Autonomous AIOps, CMDB Blast-Radius, and Self-Healing Kubernetes Control Plane">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="55%" stop-color="#0D1526" />
      <stop offset="100%" stop-color="#091B29" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" opacity="0.45" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #F8FAFC; letter-spacing: -0.5px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; fill: #94A3B8; }
      .eyebrow { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; fill: #38BDF8; letter-spacing: 1.8px; }
      .chip-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; fill: #E2E8F0; font-size: 12px; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #F1F5F9; font-size: 12.5px; }
      .node-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 500; fill: #94A3B8; font-size: 10.5px; }
      .stat-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #38BDF8; font-size: 18px; }
      .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; fill: #94A3B8; font-size: 11px; }
      @keyframes pulseRing {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.06); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -48; }
      }
      .flow-dash {
        stroke-dasharray: 8 8;
        animation: dashFlow 1.8s linear infinite;
      }
      .pulse-badge {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulseRing 2.6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Outer card -->
  <rect width="1200" height="380" rx="18" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="1200" height="380" rx="18" fill="url(#grid)" />

  <!-- Subtle radial ambient glows -->
  <circle cx="145" cy="115" r="140" fill="#0EA5E9" opacity="0.08" />
  <circle cx="1050" cy="285" r="170" fill="#10B981" opacity="0.07" />

  <!-- Top eyebrow & status pill -->
  <text x="150" y="68" class="eyebrow" font-size="12">AUTONOMOUS AIOPS • CMDB BLAST-RADIUS • SELF-HEALING KUBERNETES</text>
  <g transform="translate(945, 48)">
    <rect width="205" height="28" rx="14" fill="#0F172A" stroke="#10B981" stroke-opacity="0.55" stroke-width="1" />
    <circle cx="18" cy="14" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="18" class="chip-label" fill="#A7F3D0">FAIL-CLOSED CONTROL PLANE</text>
  </g>

  <!-- Animated Shield Emblem -->
  <g transform="translate(50, 56)">
    <path d="M40 4 L74 18 V44 C74 66 59 83 40 91 C21 83 6 66 6 44 V18 Z"
          fill="#0F172A" stroke="url(#shieldGrad)" stroke-width="2.6" filter="url(#glow)" />
    <path d="M40 16 L62 25 V43 C62 58 52 70 40 76 C28 70 18 58 18 43 V25 Z"
          fill="url(#shieldGrad)" opacity="0.14" class="pulse-badge" />
    <polyline points="24,47 33,47 38,34 44,57 49,43 56,43"
              fill="none" stroke="#38BDF8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Main Title & Subtitle -->
  <text x="150" y="114" class="title" font-size="44">AegisOps</text>
  <text x="150" y="146" class="subtitle" font-size="16">
    Zero-trust AIOps control plane that turns Kubernetes alerts into safe, evidence-backed recovery in seconds.
  </text>

  <!-- Horizontal Pipeline Flow (y=218) -->
  <line x1="120" y1="224" x2="1080" y2="224" stroke="url(#lineGrad)" stroke-width="2.5" class="flow-dash" />

  <!-- Animated signal packets traveling across the pipeline -->
  <circle r="4.5" fill="#38BDF8" filter="url(#glow)">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 120 224 L 1080 224" />
  </circle>
  <circle r="3.5" fill="#10B981" filter="url(#glow)">
    <animateMotion dur="4.2s" begin="2.1s" repeatCount="indefinite" path="M 120 224 L 1080 224" />
  </circle>

  <!-- Step Nodes -->
  <g transform="translate(46, 188)">
    <rect width="170" height="72" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.3" />
    <text x="16" y="29" class="node-title">1. Alert &amp; PII Scrub</text>
    <text x="16" y="49" class="node-sub">HMAC + SSRF + Fail-Closed</text>
  </g>

  <g transform="translate(238, 188)">
    <rect width="170" height="72" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.3" />
    <text x="16" y="29" class="node-title">2. CMDB Blast Radius</text>
    <text x="16" y="49" class="node-sub">Postgres Recursive CTE</text>
  </g>

  <g transform="translate(430, 188)">
    <rect width="170" height="72" rx="12" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.3" />
    <text x="16" y="29" class="node-title">3. Hybrid RAG + LLM</text>
    <text x="16" y="49" class="node-sub">pgvector + FTS + RRF</text>
  </g>

  <g transform="translate(622, 188)">
    <rect width="170" height="72" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.65" stroke-width="1.3" />
    <text x="16" y="29" class="node-title">4. Policy &amp; TOTP Gate</text>
    <text x="16" y="49" class="node-sub">Server-Derived Risk Tier</text>
  </g>

  <g transform="translate(814, 188)">
    <rect width="170" height="72" rx="12" fill="#0F172A" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.3" />
    <text x="16" y="29" class="node-title">5. K8s Self-Heal</text>
    <text x="16" y="49" class="node-sub">Redis Lease + Safe Patch</text>
  </g>

  <g transform="translate(1006, 188)">
    <rect width="148" height="72" rx="12" fill="#0F172A" stroke="#10B981" stroke-opacity="0.8" stroke-width="1.5" />
    <text x="14" y="29" class="node-title">6. 60s Watchdog</text>
    <text x="14" y="49" class="node-sub">Sustained Proof + PDF</text>
  </g>

  <!-- Bottom Verified KPI Strip -->
  <g transform="translate(46, 288)">
    <rect width="1108" height="68" rx="12" fill="#0B1220" stroke="#1E293B" stroke-width="1.2" />

    <text x="26" y="30" class="stat-val">65 / 65</text>
    <text x="26" y="49" class="stat-lbl">Unit, Live Integration &amp; Playwright Tests</text>

    <line x1="252" y1="14" x2="252" y2="54" stroke="#1E293B" stroke-width="1" />
    <text x="272" y="30" class="stat-val" fill="#22D3EE">1.00 / 1.00</text>
    <text x="272" y="49" class="stat-lbl">PII Scrubber Precision &amp; Recall</text>

    <line x1="482" y1="14" x2="482" y2="54" stroke="#1E293B" stroke-width="1" />
    <text x="502" y="30" class="stat-val" fill="#10B981">240 / 240</text>
    <text x="502" y="49" class="stat-lbl">k6 Burst Checks (0% Errors, p95 1.1s)</text>

    <line x1="726" y1="14" x2="726" y2="54" stroke="#1E293B" stroke-width="1" />
    <text x="746" y="30" class="stat-val" fill="#F59E0B">5 Scenarios</text>
    <text x="746" y="49" class="stat-lbl">Auto-Heal, TOTP Gate &amp; DB Safe Escalation</text>

    <line x1="974" y1="14" x2="974" y2="54" stroke="#1E293B" stroke-width="1" />
    <text x="992" y="30" class="stat-val" fill="#A78BFA">0 Cloud $</text>
    <text x="992" y="49" class="stat-lbl">100% Local AI (Ollama)</text>
  </g>
</svg>
