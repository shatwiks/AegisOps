global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: eligibility-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:58081"]
        labels:
          service: eligibility-api
          namespace: aegisops-healthcare
          cluster: kind-aegisops-local

  - job_name: claims-processor
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:58082"]
        labels:
          service: claims-processor
          namespace: aegisops-healthcare
          cluster: kind-aegisops-local

  - job_name: provider-directory
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:58083"]
        labels:
          service: provider-directory
          namespace: aegisops-healthcare
          cluster: kind-aegisops-local

  - job_name: kube-state-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:58084"]
        labels:
          cluster: kind-aegisops-local
          namespace: aegisops-healthcare

  - job_name: aegisops-control-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:58000"]
